<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JavaScript Emulation Lab</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #0c1020;
      --panel: #19223f;
      --cyan: #48d9ff;
      --yellow: #ffd34f;
      --text: #edf3ff;
      --muted: #aab6d6;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(circle at 20% 20%, #1c3d68 0, transparent 32rem),
        radial-gradient(circle at 80% 70%, #442158 0, transparent 30rem),
        var(--ink);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    main {
      width: min(900px, 100%);
      padding: clamp(2rem, 8vw, 5rem);
      border: 1px solid rgba(72, 217, 255, .45);
      border-radius: 28px;
      background: rgba(25, 34, 63, .88);
      box-shadow: 12px 12px 0 rgba(0, 0, 0, .28);
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: var(--yellow);
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 12ch;
      margin: 0;
      font-size: clamp(2.7rem, 8vw, 6rem);
      line-height: .95;
    }

    p {
      max-width: 62ch;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.7;
    }

    .systems {
      display: flex;
      flex-wrap: wrap;
      gap: .65rem;
      margin-top: 2rem;
    }

    .systems span {
      padding: .55rem .8rem;
      border: 1px solid rgba(237, 243, 255, .22);
      border-radius: 999px;
      color: var(--text);
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Browser-based preservation</p>
    <h1>JavaScript Emulation Lab</h1>
    <p>
      Classic arcade boards, consoles, and home computers reconstructed
      for the modern browser.
    </p>

    <div class="systems" aria-label="Featured systems">
      <span>Pac-Man</span>
      <span>Ms. Pac-Man</span>
      <span>Scramble</span>
      <span>Galaga</span>
      <span>Bosconian</span>
      <span>NES</span>
      <span>TurboGrafx</span>
      <span>Apple II</span>
    </div>
  </main>
</body>
</html>
