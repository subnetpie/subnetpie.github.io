<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08111b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Military Madness · Neo Nectaris</title>
  <link rel="icon" href="https://subnetpie.github.io/neo-nectaris/assets/icon.png">
  <link rel="apple-touch-icon" href="https://subnetpie.github.io/neo-nectaris/assets/icon.png">
<link rel="stylesheet" href="style.css">
<script defer src="script.js"></script>
</head>
<body>
  <main id="menu" class="menu">
    <div class="menu-inner">
      <img class="title-art" src="https://subnetpie.github.io/neo-nectaris/assets/title.png" alt="Military Madness · Neo Nectaris" width="480" height="320">
      <section class="launch" aria-label="Start a game">
        <select id="mission" hidden aria-label="Mission"></select>
        <button id="native-mission">Select mission</button>
        <div class="launch-actions">
          <button class="primary" id="start">Start mission</button>
          <button id="continue" hidden>Continue saved battle</button>
        </div>
        <div class="menu-actions">
          <button id="story">Story</button>
          <button id="credits">Credits</button>
          <button data-scenes>Battle scenes on</button>
          <button data-help>Controls</button>
          <button data-sound>Sound off</button>
        </div>
        <p class="credits">Original game and assets © Hudson Soft · Unofficial browser recreation</p>
      </section>
    </div>
  </main>

  <main id="game" class="game" hidden>
    <header class="topbar">
      <button id="pause">Menu</button>
      <div class="mission-heading">
        <div id="operation" class="eyebrow"></div>
        <h1 id="stage"></h1>
      </div>
      <div id="round" class="round"></div>
    </header>
    <div class="board">
      <aside id="training-coach" class="training-coach" role="status" hidden></aside>
      <canvas id="map" aria-label="Tactical hex map. Tap a blue unit, then tap a highlighted hex. Drag to pan." tabindex="0"></canvas>
      <div class="zoom" aria-label="Map zoom">
        <button id="zoom-out" aria-label="Zoom out">−</button>
        <button id="recenter" aria-label="Center on the Allied headquarters">⌾</button>
        <button id="zoom-in" aria-label="Zoom in">+</button>
      </div>
    </div>
    <footer class="command">
      <div class="readout">
        <strong id="selection"></strong>
        <span id="message" role="status" aria-live="polite"></span>
      </div>
      <div class="command-actions">
        <button id="secondary" hidden></button>
        <button class="primary" id="end-turn">End turn</button>
      </div>
    </footer>
  </main>

  <dialog id="modal">
    <div class="dialog-body">
      <h2 id="dialog-title"></h2>
      <div id="dialog-content"></div>
      <div id="dialog-actions" class="dialog-actions"></div>
    </div>
  </dialog>
  <audio id="music" data-src="https://subnetpie.github.io/neo-nectaris/assets/music.m4a" preload="none" loop></audio>
  <audio id="effect" data-src="https://subnetpie.github.io/neo-nectaris/assets/attack.wav" preload="none"></audio>
</body>
</html>
