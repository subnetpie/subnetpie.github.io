<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Battlezone II</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <canvas id="gameCanvas"></canvas>
    <div id="top"><div id="leftTop"><button data-btn="coin1">COIN</button><button id="colorToggle" type="button">COLORIZED</button></div><button data-btn="start1">START</button></div>
    <div id="leftControls" class="tank-controls">
      <div id="leftStick" class="stick"><span class="stick-knob"></span></div>
    </div>
    <div id="rightControls" class="tank-controls">
      <div id="rightStick" class="stick"><span class="stick-knob"></span></div>
    </div>
  </main>
  <script type="module" src="./script.js"></script>
</body>
</html>
