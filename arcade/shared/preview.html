<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Emulator shell preview</title>
<link rel="stylesheet" href="./emulator-shell.css">
<style>html,body{margin:0;height:100%;background:#10151b}</style>
</head>
<body>
<main class="emulator-shell">
  <header class="emulator-header"><h1>Emulator layout preview</h1><a class="emulator-back" href="../../">← Back</a></header>
  <nav class="emulator-toolbar" aria-label="Preview display">
    <button data-display="horizontal" aria-pressed="true">Horizontal</button>
    <button data-display="vertical" aria-pressed="false">Vertical</button>
    <button id="fullscreen">Fullscreen</button>
  </nav>
  <section class="emulator-stage" aria-label="Display sizing preview">
    <canvas width="256" height="224" aria-label="Diagnostic grid, not a running game"></canvas>
  </section>
  <div class="emulator-controls" aria-label="Example control placement">
    <div class="emulator-control-group"><button disabled aria-label="Move left">◀</button><button disabled aria-label="Move right">▶</button></div>
    <div class="emulator-control-group"><button disabled>FIRE</button></div>
  </div>
</main>
<script type="module">
import { observeDisplay } from "./emulator-shell.mjs";
const stage = document.querySelector(".emulator-stage"), canvas = document.querySelector("canvas");
const context = canvas.getContext("2d");
let stop;
function display(vertical) {
  stop?.();
  canvas.width = vertical ? 224 : 256; canvas.height = vertical ? 288 : 224;
  context.fillStyle = "#050b10"; context.fillRect(0,0,canvas.width,canvas.height);
  context.strokeStyle = "#1d3b4d";
  for (let x=0;x<canvas.width;x+=16) { context.beginPath();context.moveTo(x,0);context.lineTo(x,canvas.height);context.stroke(); }
  for (let y=0;y<canvas.height;y+=16) { context.beginPath();context.moveTo(0,y);context.lineTo(canvas.width,y);context.stroke(); }
  context.strokeStyle = "#80cde9"; context.strokeRect(.5,.5,canvas.width-1,canvas.height-1);
  context.fillStyle = "#e5edf4";context.font="12px monospace";context.textAlign="center";
  context.fillText("DISPLAY PREVIEW",canvas.width/2,canvas.height/2);
  stop = observeDisplay(stage,canvas,{width:canvas.width,height:canvas.height});
}
document.querySelectorAll("[data-display]").forEach(button => button.onclick = () => {
  document.querySelectorAll("[data-display]").forEach(other => other.setAttribute("aria-pressed",String(other===button)));
  display(button.dataset.display==="vertical");
});
const fullscreen = document.querySelector("#fullscreen");
fullscreen.hidden = !document.fullscreenEnabled;
fullscreen.onclick = async () => {
  try { if(document.fullscreenElement) await document.exitFullscreen(); else await document.querySelector("main").requestFullscreen(); }
  catch { fullscreen.textContent="Fullscreen unavailable"; }
};
display(false);
</script>
</body>
</html>
