<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Battlezone</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <canvas id="gameCanvas"></canvas>
    <div id="top"><button data-btn="coin1">COIN</button><button data-btn="start1">START</button></div>
    <div id="leftControls" class="tank-controls">
      <button class="fire" data-btn="fire">FIRE</button>
      <div id="leftStick" class="stick"><span>↕</span></div>
    </div>
    <div id="rightControls" class="tank-controls">
      <button class="fire" data-btn="fire">FIRE</button>
      <div id="rightStick" class="stick"><span>↕</span></div>
    </div>
  </main>
  <script type="module" src="./script.js"></script>
</body>
</html>
