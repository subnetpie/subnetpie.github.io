<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>JSScramble</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div id="gameContainer">
 <!-- Game screen -->
 <canvas id="gameCanvas" width="256" height="256"></canvas>
 <!-- Coin / Start -->
 <div id="buttonPanel">
  <button data-btn="coin1">COIN</button>
  <button data-btn="start1">START</button>
 </div>

 <!-- D-pad -->
 <div id="dpad">
  <div id="dpad-ring">
   <canvas id="dpad-canvas" width="200" height="200"></canvas>
  </div>
 </div>

 <!-- Fire / Bomb -->
 <div id="button-pad">
  <div id="btn-fire">FIRE</div>
  <div id="btn-bomb">BOMB</div>
 </div>
</div>
    <script type="module" src="./script.js"></script>

  </body>
  
</html>
