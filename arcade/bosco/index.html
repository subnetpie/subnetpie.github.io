<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>JSBosco</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div id="gameContainer">
  <canvas id="gameCanvas"></canvas>

  <!-- Touch Controls -->
  <button id="btnCoin" class="touch-button system-button" aria-label="Insert Coin">COIN</button>
  <button id="btnStart" class="touch-button system-button" aria-label="Start Game">START</button>
</div>

<!-- D-pad -->
<div id="dpad">
  <div id="dpad-ring">
    <canvas id="dpad-canvas" width="250" height="250"></canvas>
  </div>
</div>

<!-- Fire / Bomb -->
<div id="button-pad">
  <div id="btn-fire">FIRE</div>
</div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>
