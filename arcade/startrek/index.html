<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Star Trek</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="cockpit">
    <aside class="rail rail-left" aria-label="Navigation and system controls">
      <div class="course-panel">
        <div class="panel-label">COURSE</div>
        <div class="turn">
          <button class="course-button" data-key="left" aria-label="Turn left">◀</button>
          <button class="course-button" data-key="right" aria-label="Turn right">▶</button>
        </div>
      </div>
      <div class="system">
        <button data-key="coin">Coin</button>
        <button data-key="start">Start</button>
        <button id="pause">Pause</button>
      </div>
    </aside>

    <section class="display-wrap">
      <canvas id="screen" width="1024" height="832" aria-label="Star Trek vector display"></canvas>
      <p id="status" role="status">Loading…</p>
    </section>

    <aside class="rail rail-right" aria-label="Enterprise controls">
      <div class="panel-label">ENTERPRISE</div>
      <div class="actions primary-actions">
        <button class="action impulse" data-key="shield">Impulse</button>
        <button class="action fire" data-key="fire">Fire</button>
      </div>
      <div class="actions special-actions">
        <button class="action photon" data-key="photon">Photon<br>Torpedo</button>
        <button class="action warp" data-key="warp">Warp</button>
      </div>
    </aside>
  </main>
  <script type="module" src="./script.js"></script>
</body>
</html>
