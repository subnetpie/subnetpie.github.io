<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Star Trek</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="cockpit">
    <section class="display-wrap" aria-label="Star Trek playfield">
      <canvas id="screen" width="1024" height="832" aria-label="Star Trek vector display"></canvas>
      <div class="gesture-hint" aria-hidden="true">DRAG LEFT / RIGHT TO TURN</div>
      <p id="status" role="status">Loading…</p>
    </section>

    <div class="system-controls" data-no-swipe aria-label="System controls">
      <button data-key="coin">Coin</button>
      <button data-key="start">Start</button>
      <button id="pause">Pause</button>
    </div>

    <div class="left-thumb" data-no-swipe aria-label="Left thumb control">
      <button class="action impulse" data-key="shield">Impulse</button>
    </div>

    <div class="right-thumb" data-no-swipe aria-label="Right thumb controls">
      <div class="special-actions">
        <button class="action photon" data-key="photon">Photon</button>
        <button class="action warp" data-key="warp">Warp</button>
      </div>
      <button class="action fire" data-key="fire">Fire</button>
    </div>
  </main>

  <script type="module" src="./script.js"></script>
  <script type="module" src="./gesture.js"></script>
</body>
</html>
