<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Star Trek</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <canvas id="screen" width="1024" height="832" aria-label="Star Trek vector display"></canvas>
    <div id="controls">
      <div class="turn">
        <button data-key="left">◀</button>
        <button data-key="right">▶</button>
      </div>
      <div class="actions">
        <button data-key="fire">Fire</button>
        <button data-key="photon">Photon</button>
        <button data-key="shield">Shield</button>
        <button data-key="warp">Warp</button>
      </div>
      <div class="system">
        <button data-key="coin">Coin</button>
        <button data-key="start">Start</button>
        <button id="pause">Pause</button>
      </div>
    </div>
    <p id="status" role="status">Loading…</p>
  </main>
  <script type="module" src="./script.js"></script>
</body>
</html>
