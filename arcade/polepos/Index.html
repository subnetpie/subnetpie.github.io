<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10151b">
  <title>JSPolePosition</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header><a href="../../">← Arcade</a><h1>Pole Position</h1><span>Namco · 1982</span></header>
    <div id="gameContainer">
      <canvas id="gameCanvas" width="256" height="224" aria-label="Pole Position game screen"></canvas>
      <div id="loadingPanel"><p id="status" role="status">Loading ROMs…</p><button id="play" hidden>Play with sound</button></div>
    </div>
    <div class="toolbar">
      <button id="btnCoin" data-input="coin">COIN <small>5</small></button>
      <button id="btnGear" aria-pressed="false">LOW GEAR <small>G</small></button>
      <button id="btnPause" disabled>Pause</button>
      <button id="btnReset" disabled>Reset</button>
      <button id="btnSound" aria-pressed="true">Sound on</button>
      <button id="btnFullscreen">Fullscreen</button>
    </div>
    <div class="driving-controls">
      <div id="dpad"><button data-input="left" aria-label="Steer left">◀</button><button data-input="right" aria-label="Steer right">▶</button></div>
      <div id="button-pad"><button data-input="brake">BRAKE</button><button data-input="accel">GAS</button></div>
    </div>
    <p class="help">← → steer · ↑ gas · ↓ brake · G gear · 5 coin. Insert a coin, then press the gas to start.</p>
    <details><summary>Load ROM files</summary><p>Load Pole Position ROM ZIPs or individual files. You can use the source ZIPs from a MiSTer pack.</p><input id="romFiles" type="file" multiple aria-label="Select ROM ZIPs or files"><button id="loadFiles">Load selected files</button><pre id="romErrors" role="alert"></pre></details>
  </main>
  <script type="module" src="./script.js"></script>
</body>
</html>
