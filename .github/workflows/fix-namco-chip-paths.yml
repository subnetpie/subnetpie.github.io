name: Fix Namco chip paths

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-namco-chip-paths.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair chip imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('arcade/namco')
          exts = {'.js','.mjs','.html','.css','.md','.json','.txt'}
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in exts or 'chips' in p.parts:
                  continue
              try:
                  s = p.read_text()
              except UnicodeDecodeError:
                  continue
              ns = s.replace('../../../chips/', '../chips/')
              ns = ns.replace('../../chips/', '../chips/')
              if ns != s:
                  p.write_text(ns)
          readme = Path('arcade/namco/chips/README.md')
          if readme.exists():
              s = readme.read_text()
              ns = s.replace('../arcade/pole-position/ALIGNMENT.md', '../polepos/ALIGNMENT.md')
              ns = ns.replace('../arcade/polepos/ALIGNMENT.md', '../polepos/ALIGNMENT.md')
              if ns != s:
                  readme.write_text(ns)
          PY
          git rm -f .github/workflows/fix-namco-chip-paths.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Repair imports after moving Namco chips"
          git push
