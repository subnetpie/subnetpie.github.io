name: Bump ROM03 HDV cache
on:
  push:
    paths:
      - .github/workflows/bump-rom03-hdv-cache.yml
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump controls cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('computer/appleii/index.html')
          s=p.read_text()
          old='./controls-menu.js?v=20261101-bootlogic1'
          new='./controls-menu.js?v=20261101-rom03hdv2'
          if old not in s:
              raise SystemExit('controls cache key not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit cache bump
        run: |
          rm -f .github/workflows/bump-rom03-hdv-cache.yml
          git config user.name subnetpie
          git config user.email subnetpie@hotmail.com
          git add -A
          git commit -m "Refresh ROM03 HDV boot assets"
          git push
