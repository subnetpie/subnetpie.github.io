name: Fix Namco audio paths

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-namco-audio-paths.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair Namco audio imports
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/fix-namco-audio-paths.yml')
          exts = {'.js','.mjs','.html','.md','.json','.yml','.yaml','.txt'}

          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p == workflow or p.suffix.lower() not in exts:
                  continue
              try:
                  s = p.read_text()
              except UnicodeDecodeError:
                  continue
              ns = s
              ns = ns.replace('../chips/NamcoWSG.js', '../audio/NamcoWSG.js')
              ns = ns.replace('../chips/Namco52XX.js', '../audio/Namco52XX.js')
              ns = ns.replace('../chips/Namco54XX.js', '../audio/Namco54XX.js')
              ns = ns.replace('./MB88xx.js', '../chips/MB88xx.js') if p.as_posix() in {
                  'arcade/namco/audio/Namco52XX.js',
                  'arcade/namco/audio/Namco54XX.js'
              } else ns
              if ns != s:
                  p.write_text(ns)

          readme = Path('arcade/namco/chips/README.md')
          if readme.exists():
              s = readme.read_text()
              s = s.replace('including Namco 06XX, 50XX, 51XX, 52XX, 53XX, 54XX, Namco WSG, and the Fujitsu MB88xx/MB8841/42/43/44 MCU family.', 'including Namco 06XX, 50XX, 51XX, 53XX, and the Fujitsu MB88xx/MB8841/42/43/44 MCU family. Audio devices (Namco 52XX, 54XX, and WSG) live in `../audio/`.')
              s = s.replace('`../arcade/namco/polepos/ALIGNMENT.md`', '`../polepos/ALIGNMENT.md`')
              readme.write_text(s)
          PY
          git rm -f .github/workflows/fix-namco-audio-paths.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Repair imports after moving Namco audio devices"
          git push
