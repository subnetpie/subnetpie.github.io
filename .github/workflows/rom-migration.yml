name: Finalize Apple II ROM migration

on:
  push:
    paths:
      - '.github/workflows/rom-migration.yml'
      - 'tools/finalize-appleii-roms.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite ROM callers
        run: python3 tools/finalize-appleii-roms.py
      - name: Run ROM-dependent tests
        run: node --test computer/appleii/woz.test.mjs computer/appleii/memory_expansion.test.mjs
      - name: Commit migration
        run: |
          rm .github/workflows/rom-migration.yml tools/finalize-appleii-roms.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finish Apple II raw ROM migration'
          git push
