name: Fix landscape keyboard toggle
on:
  push:
    paths:
      - .github/workflows/fix-landscape-keyboard.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch keyboard CSS
        run: |
          git show 8f752e56ab579690a017a3ad26f8c7529265881d:computer/appleii/style.css > computer/appleii/style.css
          python - <<'PY'
          from pathlib import Path

          p=Path('computer/appleii/style.css')
          s=p.read_text()
          old="#keyboard1.apple2-keyboard {\n  box-sizing: border-box;"
          new="#keyboard1.apple2-keyboard {\n  display: none !important;\n  box-sizing: border-box;"
          if old not in s:
              raise SystemExit('keyboard base rule not found')
          p.write_text(s.replace(old,new,1))

          p=Path('computer/appleii/index.html')
          s=p.read_text()
          marker='./style.css?v='
          i=s.find(marker)
          if i < 0:
              raise SystemExit('style cache key not found')
          quote_positions=[x for x in (s.find('"',i),s.find("'",i)) if x >= 0]
          if not quote_positions:
              raise SystemExit('style cache key terminator not found')
          j=min(quote_positions)
          s=s[:i]+'./style.css?v=20261017-landscape-keyboard1'+s[j:]
          p.write_text(s)
          PY
      - name: Verify keyboard rule
        run: |
          grep -A3 '#keyboard1.apple2-keyboard {' computer/appleii/style.css | head -4
          grep 'style.css?v=20261017-landscape-keyboard1' computer/appleii/index.html
      - name: Commit fix
        run: |
          rm -f .github/workflows/fix-landscape-keyboard.yml
          git config user.name subnetpie
          git config user.email subnetpie@hotmail.com
          git add -A
          git commit -m "Fix landscape keyboard hide toggle"
          git push
