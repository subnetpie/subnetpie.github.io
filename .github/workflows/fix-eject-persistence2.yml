name: Fix disk eject persistence 2

on:
  push:
    paths:
      - '.github/workflows/fix-eject-persistence2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply fix
        run: node tools/fix-eject-persistence.mjs
      - name: Verify
        run: |
          node --check computer/appleii/iigs_storage_registry.js
          node --check computer/appleii/unified_drive_manager.js
          grep -q "await setKeep(ep.persistenceId,false)" computer/appleii/iigs_storage_registry.js
          grep -q "await svc.eject(id)" computer/appleii/unified_drive_manager.js
      - name: Commit
        run: |
          rm -f tools/fix-eject-persistence.mjs .github/workflows/fix-eject-persistence.yml .github/workflows/fix-eject-persistence2.yml
          git config user.name subnetpie
          git config user.email subnetpie@hotmail.com
          git add -A
          git commit -m "Make disk eject clear persistent mounts"
          git push
