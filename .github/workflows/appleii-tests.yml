name: Apple II tests

on:
  push:
    branches: [master]
    paths:
      - 'computer/appleii/**'
      - '.github/workflows/appleii-tests.yml'
  pull_request:
    paths:
      - 'computer/appleii/**'
      - '.github/workflows/appleii-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Apple II tests
        run: node --test computer/appleii/*.test.mjs
