name: Apple II slot bus cleanup

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/appleii-slotbus-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Namco DAC paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('arcade/namco/bosco/script.js'): {
                  '../../../audio/Namco52xxDac.js': '../audio/Namco52xxDac.js',
                  '../../../audio/Namco54xxDac.js': '../audio/Namco54xxDac.js',
              },
              Path('arcade/namco/galaga/script.js'): {
                  '../../../audio/Namco54xxDac.js': '../audio/Namco54xxDac.js',
              },
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs.items():
                  if old not in text:
                      raise SystemExit(f'expected path not found in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY

          git rm audio/Namco52xxDac.js audio/Namco54xxDac.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arcade/namco/bosco/script.js arcade/namco/galaga/script.js
          git diff --cached --check
          git commit -m '[skip ci] Use canonical Namco DAC paths'
          git push
