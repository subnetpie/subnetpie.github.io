name: Apple II slot bus cleanup

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/appleii-slotbus-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Namco typed-array checks realm-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('arcade/namco/audio/NamcoWSG.js'): [
                  ('if (!(waveformProm instanceof Uint8Array) || waveformProm.length < 0x100)',
                   'if (!ArrayBuffer.isView(waveformProm) || waveformProm.BYTES_PER_ELEMENT !== 1 || waveformProm.length < 0x100)')
              ],
              Path('arcade/namco/audio/Namco52XX.js'): [
                  ('voiceRom instanceof Uint8Array ? voiceRom : new Uint8Array(0)',
                   'ArrayBuffer.isView(voiceRom) && voiceRom.BYTES_PER_ELEMENT === 1 ? voiceRom : new Uint8Array(0)')
              ],
              Path('arcade/namco/audio/Namco54XX.js'): [
                  ('if (!(romData instanceof Uint8Array)) {',
                   'if (!ArrayBuffer.isView(romData) || romData.BYTES_PER_ELEMENT !== 1) {')
              ],
              Path('arcade/namco/chips/Namco51XX.js'): [
                  ('if (!(romData instanceof Uint8Array)) {',
                   'if (!ArrayBuffer.isView(romData) || romData.BYTES_PER_ELEMENT !== 1) {')
              ],
              Path('arcade/namco/chips/MB88xx.js'): [
                  ('romData instanceof Uint8Array ? romData : new Uint8Array(romData)',
                   'ArrayBuffer.isView(romData) && romData.BYTES_PER_ELEMENT === 1 ? romData : new Uint8Array(romData)')
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'expected pattern not found in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          node --check arcade/namco/audio/NamcoWSG.js
          node --check arcade/namco/audio/Namco52XX.js
          node --check arcade/namco/audio/Namco54XX.js
          node --check arcade/namco/chips/Namco51XX.js
          node --check arcade/namco/chips/MB88xx.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arcade/namco/audio/NamcoWSG.js arcade/namco/audio/Namco52XX.js arcade/namco/audio/Namco54XX.js arcade/namco/chips/Namco51XX.js arcade/namco/chips/MB88xx.js
          git diff --cached --check
          git commit -m '[skip ci] Make Namco typed-array guards realm-safe'
          git push
