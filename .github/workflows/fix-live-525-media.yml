name: Fix live 5.25 media changes
on:
  push:
    paths:
      - .github/workflows/fix-live-525-media.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply live 5.25 media fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              if s.count(old) < count:
                  raise SystemExit(f'{path}: expected text not found')
              p.write_text(s.replace(old,new,count))

          p='computer/appleii/FloppyWoz525.js'
          replace(p,
          '    reset_rotation()  { this.byte_pos = 0; }',
          '    reset_rotation(cycles = 0)  { this.byte_pos = 0; }')
          replace(p,
          '''    reset_rotation() {\n        this._bit_pos    = 0;\n        this._latch      = 0;\n        this._latch_delay = 0;\n        this._shift      = 0;\n        this._last_cycle = 0;\n    }''',
          '''    reset_rotation(cycles = 0) {\n        this._bit_pos    = 0;\n        this._latch      = 0;\n        this._latch_delay = 0;\n        this._shift      = 0;\n        // A disk inserted while the machine is running begins rotating now.\n        // Starting at cycle zero makes the first WOZ read consume the entire\n        // elapsed emulation time and can stall live disk insertion.\n        this._last_cycle = cycles >>> 0;\n    }''')
          replace(p,
          '''    mount_medium(name, medium) {\n        this.name          = name;\n        this.medium        = medium;\n        this.write_protect = true; // write sequencing is not implemented for either format\n        if(this.medium) {\n            this.medium.set_head_pos(this.head_pos);\n            this.medium.reset_rotation();\n        }\n    }''',
          '''    mount_medium(name, medium, cycles = 0) {\n        this.name          = name;\n        this.medium        = medium;\n        this.write_protect = true; // write sequencing is not implemented for either format\n        if(this.medium) {\n            this.medium.set_head_pos(this.head_pos);\n            this.medium.reset_rotation(cycles);\n        }\n    }\n\n    eject() {\n        // Physical eject changes the medium, not the controller motor/select\n        // latches. Clearing the medium atomically prevents stale disk data from\n        // surviving a desktop swap while preserving the guest's drive state.\n        this.name = \"\";\n        this.medium = null;\n        this.write_protect = true;\n    }''')
          replace(p,
          '        this._disks[num].mount_medium(name, medium);',
          '        this._disks[num].mount_medium(name, medium, this._get_cycles());', 1)
          replace(p,
          '            this._disks[num].mount_medium(name, medium);',
          '            this._disks[num].mount_medium(name, medium, this._get_cycles());', 1)
          replace(p,
          '            this._disks[num].mount_medium(name, new NibMedium(name, sigBytes));',
          '            this._disks[num].mount_medium(name, new NibMedium(name, sigBytes), this._get_cycles());')
          replace(p,
          '''    reset() {\n        this._disks[0].reset();''',
          '''    eject(num) {\n        if(num !== 0 && num !== 1) throw new Error(\"Invalid drive\");\n        this._disks[num].eject();\n    }\n\n    reset() {\n        this._disks[0].reset();''')

          p='computer/appleii/media.js'
          replace(p,
          '''  else {\n    board.floppy525._disks[drive].medium=null;\n    board.floppy525._disks[drive].name='';\n  }''',
          '''  else {\n    board.floppy525.eject(drive);\n  }''')
          replace(p,
          '''  board.floppy525._disks[drive].medium=null;\n  board.floppy525._disks[drive].name='';''',
          '''  board.floppy525.eject(drive);''')

          p='computer/appleii/iigs_storage_registry.js'
          replace(p,
          '''  else if(ep.controller==='disk2'){\n    const disk=b.floppy525?._disks?.[ep.index];if(disk){disk.medium=null;disk.name='';}\n  }else b.prodosBlock?.eject(ep.index);''',
          '''  else if(ep.controller==='disk2')b.floppy525?.eject(ep.index);\n  else b.prodosBlock?.eject(ep.index);''')

          p='computer/appleii/disk_swap.test.mjs'
          replace(p,
          "import {mountMedia,decodeMedia,readZipEntries} from './media.js';",
          "import {mountMedia,ejectMedia,decodeMedia,readZipEntries} from './media.js';")
          replace(p,
          " const {ejectMedia}=await import('./media.js');\n const {board:m}=createMachine('iie');",
          " const {board:m}=createMachine('iie');")
          s=Path(p).read_text()
          s += '''\n\ntest('IIgs sees live 5.25 insertion and eject without reset',()=>{\n const {board:m}=createMachine('iigs');\n m.memory.read(0xc0e9); // motor on\n assert.equal(m.floppy525._active_disk.medium,null);\n const regs={...m.cpu.register};\n mountMedia(m,decodeMedia('geos-data.dsk',new Uint8Array(143360)),0,{preserveSession:true});\n assert.deepEqual({...m.cpu.register},regs);\n assert.ok(m.floppy525._active_disk.medium);\n // Q6L data is immediately visible to software polling the already-running drive.\n assert.notEqual(m.memory.read(0xc0ec),0);\n ejectMedia(m,0);\n assert.equal(m.floppy525._active_disk.medium,null);\n assert.equal(m.memory.read(0xc0ec),0);\n});\n'''
          Path(p).write_text(s)

          # Ensure browsers fetch the corrected modules.
          p='computer/appleii/script.js'; s=Path(p).read_text()
          s=s.replace("./media.js?v=20260930-gsos-drives", "./media.js?v=20261018-live525-1")
          Path(p).write_text(s)
          p='computer/appleii/iigs_storage_registry.js'; s=Path(p).read_text()
          s=s.replace("./media.js?v=20260930-gsos-drives", "./media.js?v=20261018-live525-1")
          Path(p).write_text(s)
          p='computer/appleii/controls-menu.js'; s=Path(p).read_text()
          s=s.replace("./iigs_storage_registry.js?v=20261007-physical2", "./iigs_storage_registry.js?v=20261018-live525-1")
          Path(p).write_text(s)
          PY
      - name: Run targeted disk tests
        run: |
          node --test computer/appleii/disk_swap.test.mjs
          node --test computer/appleii/floppy_speed.test.mjs
          git diff --check
      - name: Commit fix
        run: |
          rm -f .github/workflows/fix-live-525-media.yml
          git config user.name subnetpie
          git config user.email subnetpie@hotmail.com
          git add -A
          git commit -m "Fix live 5.25 disk insert and eject state"
          git push
