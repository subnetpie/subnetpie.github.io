name: Fix unified gear icon
on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/fix-unified-gear.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace gear SVG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('computer/appleii/unified_controls.js')
          s=p.read_text()
          old='''    gear.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.8 2.6h4.4l.6 2.4c.7.2 1.4.5 2 .8l2.1-1.3 3.1 3.1-1.3 2.1c.4.6.6 1.3.8 2l2.4.6v4.4l-2.4.6c-.2.7-.5 1.4-.8 2l1.3 2.1-3.1 3.1-2.1-1.3c-.6.4-1.3.6-2 .8l-.6 2.4H9.8L9.2 22c-.7-.2-1.4-.5-2-.8l-2.1 1.3L2 19.4l1.3-2.1c-.4-.6-.6-1.3-.8-2L.1 14.7v-4.4l2.4-.6c.2-.7.5-1.4.8-2L2 5.6l3.1-3.1 2.1 1.3c.6-.4 1.3-.6 2-.8z"/><circle cx="12" cy="12.5" r="4.4"/></svg>';'''
          new='''    gear.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.01 5.08 10.48 3.13h3.04l.47 1.95 1.5.62 1.71-1.05 2.15 2.15-1.05 1.71.62 1.5 1.95.47v3.04l-1.95.47-.62 1.5 1.05 1.71-2.15 2.15-1.71-1.05-1.5.62-.47 1.95h-3.04l-.47-1.95-1.5-.62-1.71 1.05-2.15-2.15 1.05-1.71-.62-1.5-1.95-.47v-3.04l1.95-.47.62-1.5-1.05-1.71 2.15-2.15 1.71 1.05z"/><circle cx="12" cy="12" r="3.35"/></svg>';'''
          if old not in s:
              raise SystemExit('old gear SVG not found')
          p.write_text(s.replace(old,new,1))

          p=Path('computer/appleii/controls-menu.js')
          s=p.read_text()
          old="unified:'./unified_controls.js?v=20261017-gear-icon1'"
          new="unified:'./unified_controls.js?v=20261017-gear-icon2'"
          if old not in s:
              raise SystemExit('controls cache key not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Remove migration workflow
        run: rm .github/workflows/fix-unified-gear.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add computer/appleii/unified_controls.js computer/appleii/controls-menu.js .github/workflows/fix-unified-gear.yml
          git commit -m "Refine unified gear icon"
          git push
