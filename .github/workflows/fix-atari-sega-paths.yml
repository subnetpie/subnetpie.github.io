name: Fix Atari and Sega paths
on:
  push:
    paths:
      - '.github/workflows/fix-atari-sega-paths.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair Atari and Sega paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          roots = [
              Path('arcade/atari/bzone'),
              Path('arcade/atari/bzone-old'),
              Path('arcade/sega/cannonball'),
              Path('arcade/sega/startrek'),
          ]
          text_exts = {'.js','.mjs','.html','.css','.md','.json','.txt','.yml','.yaml'}
          for root in roots:
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in text_exts:
                      continue
                  try:
                      s = p.read_text()
                  except UnicodeDecodeError:
                      continue
                  t = s.replace('../../cpu/', '../../../cpu/')
                  t = t.replace('../../audio/', '../../../audio/')
                  t = t.replace('../../index.html', '../../../index.html')
                  if t != s:
                      p.write_text(t)

          replacements = {
              'arcade/bzone-old': 'arcade/atari/bzone-old',
              'arcade/bzone': 'arcade/atari/bzone',
              'arcade/cannonball': 'arcade/sega/cannonball',
              'arcade/startrek': 'arcade/sega/startrek',
          }
          skip = Path('.github/workflows/fix-atari-sega-paths.yml')
          for p in Path('.').rglob('*'):
              if not p.is_file() or p == skip or '.git' in p.parts:
                  continue
              if p.suffix.lower() not in text_exts:
                  continue
              try:
                  s = p.read_text()
              except UnicodeDecodeError:
                  continue
              t = s
              for old,new in replacements.items():
                  t = t.replace(old,new)
              if t != s:
                  p.write_text(t)
          PY
          rm -f .github/workflows/fix-atari-sega-paths.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair paths after Atari and Sega reorganization'
          git push
