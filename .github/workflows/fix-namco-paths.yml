name: Fix Namco paths

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-namco-paths.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair moved Namco paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          games = ['bosco','digdug','galaga','mspacman','pacman','polepos']
          exts = {'.js','.mjs','.html','.css','.md','.json','.yml','.yaml','.txt'}
          helper = Path('.github/workflows/fix-namco-paths.yml')

          for game in games:
              root = Path('arcade/namco') / game
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in exts:
                      continue
                  try:
                      s = p.read_text()
                  except UnicodeDecodeError:
                      continue
                  ns = s.replace('../../cpu/', '../../../cpu/')
                  ns = ns.replace('../../chips/', '../../../chips/')
                  ns = ns.replace('../../audio/', '../../../audio/')
                  if p.name == 'index.html' and p.parent == root:
                      ns = ns.replace('href="../../"', 'href="../../../"')
                      ns = ns.replace("href='../../'", "href='../../../'")
                  if ns != s:
                      p.write_text(ns)

          replacements = {
              '/arcade/bosco/': '/arcade/namco/bosco/',
              '/arcade/digdug/': '/arcade/namco/digdug/',
              '/arcade/galaga/': '/arcade/namco/galaga/',
              '/arcade/mspacman/': '/arcade/namco/mspacman/',
              '/arcade/pacman/': '/arcade/namco/pacman/',
              '/arcade/polepos/': '/arcade/namco/polepos/',
          }
          for p in Path('.').rglob('*'):
              if p == helper or not p.is_file() or '.git' in p.parts or p.suffix.lower() not in exts:
                  continue
              try:
                  s = p.read_text()
              except UnicodeDecodeError:
                  continue
              ns = s
              for old, new in replacements.items():
                  ns = ns.replace(old, new)
              if ns != s:
                  p.write_text(ns)
          PY
          git rm -f .github/workflows/fix-namco-paths.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Repair paths after Namco arcade reorganization"
          git push
